# Configuración de OpenAL Soft para EntornoLab (la lee la DLL por ALSOFT_CONF).
# El HRTF, el perfil de cabeza y el modo de salida NO se fijan aquí: los pide
# el programa por atributos del contexto, para poder cambiarlos en caliente y
# comprobar que de verdad quedan activos.

[general]
# Remuestreo de calidad para los cambios de tono (sonda, pasos).
resampler = cubic
# Dos envíos auxiliares por fuente: los usa el fundido entre dos reverberaciones.
sends = 2
